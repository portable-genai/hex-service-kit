[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hex-service-kit"
version = "0.0.5"
description = "The shared service spine for hexagonal agent repos: a server-verified identity layer (Principal / IdentityPort / seeded dev personas that discard the client-asserted actor), service-to-service transport hardening (https-only base URLs, bearer + HMAC-signed actor propagation, fail-closed caller authentication), fail-closed network defaults (loopback bind with an explicit insecure-demo guard, a CORS allowlist that can never fall back to '*'), and kernel primitives (a StrEnum base and an append-only hash-chained WORM audit log). Pure standard library core, with an optional FastAPI integration layer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Awasthi" }]
keywords = [
  "identity", "authentication", "principal", "s2s", "service-to-service",
  "fail-closed", "cors", "audit", "hash-chain", "worm", "hexagonal",
  "ports-and-adapters", "fastapi",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Framework :: FastAPI",
  "Typing :: Typed",
]

# ZERO runtime dependencies for the core (identity, s2s, netdefaults, enums, audit,
# serialization): all stdlib, so a consumer inherits no transitive runtime deps and the
# kernel primitives install and run on an air-gapped host. The FastAPI integration layer
# (``hex_service_kit.web``) needs FastAPI; declare it via the ``fastapi`` extra so a
# consumer that only wants the kernel does not pull a web framework.
dependencies = []

[project.optional-dependencies]
# Request-integration helpers (``hex_service_kit.web``): the get_principal dependency,
# fail-closed service-caller authentication, and the security-header middleware.
fastapi = ["fastapi>=0.110", "starlette>=0.36"]
# The OpenTelemetry tracer implementation in `tracing.py`. The tracer PORT and the log
# formatter stay in the core, so a repo can bind and log with none of this installed; only
# a deployed profile that actually exports spans needs the extra.
otel = [
  "opentelemetry-sdk>=1.44",
  "opentelemetry-exporter-gcp-trace>=1.15",
  "opentelemetry-exporter-otlp-proto-http>=1.44",
  "requests>=2.31",           # authenticated OTLP session for a private Cloud Run collector
  "google-auth>=2.30",        # mints the per-export ID token that collector requires
]
# Serving a governed tool catalog over MCP (``hex_service_kit.mcpserve``), and validating a
# rendered plugin against the vendored Agent Plugins schemas. The PACKAGING half
# (``hex_service_kit.plugin``) stays in the stdlib core, so a repo renders its plugin with none
# of this installed; only actually serving the catalog, or validating what was rendered, needs
# the extra. Both imports are lazy and inside functions.
#
# `mcp>=2.1` is a floor with teeth rather than a courtesy: the 1.x SDK predates the stateless
# 2026-07-28 era and cannot speak it at all, so an older resolution would quietly put this
# server back on the initialize handshake that revision removed.
interop = ["mcp>=2.1", "jsonschema>=4.26"]
# The test/lint toolchain. Ruff is pinned EXACTLY so formatting never drifts across
# machines. The dev extra pulls the fastapi extra so mypy and pytest cover ``web.py``, and the
# interop extra so the offline gate exercises a REAL client/server session rather than skipping
# the one module whose whole claim is that it serves what the catalog declares.
dev = [
  "hex-service-kit[fastapi]",
  "hex-service-kit[interop]",
  "httpx>=0.27",
  "ruff==0.16.4",
  "mypy>=1.10",
  "pytest>=8.2",
]

[project.urls]
Homepage = "https://github.com/portable-genai/hex-service-kit"
Source = "https://github.com/portable-genai/hex-service-kit"
Issues = "https://github.com/portable-genai/hex-service-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hex_service_kit"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# Only what is GENUINELY absent from the gate. The `otel` extra is not installed in CI (the
# point of the extra is that the core works without it), so the SDK and the exporters really
# are missing and their lazy, inside-a-function imports are unresolvable here. `requests` is
# the same case.
#
# `opentelemetry.trace` is deliberately NOT in this list. The MCP SDK depends on
# opentelemetry-api, so the tracing API is now present transitively and mypy type-checks it for
# real. `tracing.py` and `logging.py` import it as a module path (`import opentelemetry.trace`)
# rather than as an attribute of the namespace package (`from opentelemetry import trace`),
# which is what makes it resolve. Widening this to `opentelemetry.*`, or reaching for
# `follow_imports = "skip"`, would make the symptom go away by blinding strict mode to every
# real OpenTelemetry type error in those two modules from here on.
[[tool.mypy.overrides]]
module = ["opentelemetry.sdk.*", "opentelemetry.exporter.*", "requests.*"]
ignore_missing_imports = true

# The `interop` extra carries the MCP SDK and the JSON Schema validator. Both are imported
# lazily inside functions in ``mcpserve``, so the core still type-checks on a machine that has
# neither, and this narrows the allowance to exactly those packages.
[[tool.mypy.overrides]]
module = ["mcp.*", "jsonschema.*", "anyio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
