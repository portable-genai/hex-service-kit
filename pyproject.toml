[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hex-service-kit"
version = "0.0.1"
description = "The shared service spine for hexagonal agent repos: a server-verified identity layer (Principal / IdentityPort / seeded dev personas that discard the client-asserted actor), service-to-service transport hardening (https-only base URLs, bearer + HMAC-signed actor propagation, fail-closed caller authentication), fail-closed network defaults (loopback bind with an explicit insecure-demo guard, a CORS allowlist that can never fall back to '*'), and kernel primitives (a StrEnum base and an append-only hash-chained WORM audit log). Pure standard library core, with an optional FastAPI integration layer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Awasthi" }]
keywords = [
  "identity", "authentication", "principal", "s2s", "service-to-service",
  "fail-closed", "cors", "audit", "hash-chain", "worm", "hexagonal",
  "ports-and-adapters", "fastapi",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Framework :: FastAPI",
  "Typing :: Typed",
]

# ZERO runtime dependencies for the core (identity, s2s, netdefaults, enums, audit,
# serialization): all stdlib, so a consumer inherits no transitive runtime deps and the
# kernel primitives install and run on an air-gapped host. The FastAPI integration layer
# (``hex_service_kit.web``) needs FastAPI; declare it via the ``fastapi`` extra so a
# consumer that only wants the kernel does not pull a web framework.
dependencies = []

[project.optional-dependencies]
# Request-integration helpers (``hex_service_kit.web``): the get_principal dependency,
# fail-closed service-caller authentication, and the security-header middleware.
fastapi = ["fastapi>=0.110", "starlette>=0.36"]
# The OpenTelemetry tracer implementation in `tracing.py`. The tracer PORT and the log
# formatter stay in the core, so a repo can bind and log with none of this installed; only
# a deployed profile that actually exports spans needs the extra.
otel = [
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-gcp-trace>=1.7",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "requests>=2.31",           # authenticated OTLP session for a private Cloud Run collector
  "google-auth>=2.30",        # mints the per-export ID token that collector requires
]
# The test/lint toolchain. Ruff is pinned EXACTLY so formatting never drifts across
# machines. The dev extra pulls the fastapi extra so mypy and pytest cover ``web.py``.
dev = [
  "hex-service-kit[fastapi]",
  "httpx>=0.27",
  "ruff==0.16.4",
  "mypy>=1.10",
  "pytest>=8.2",
]

[project.urls]
Homepage = "https://github.com/portable-genai/hex-service-kit"
Source = "https://github.com/portable-genai/hex-service-kit"
Issues = "https://github.com/portable-genai/hex-service-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hex_service_kit"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# The `otel` extra is not installed in CI (the point of the extra is that the core works
# without it), and neither opentelemetry nor requests ships type information mypy can find
# here. The imports are lazy and inside functions, so this narrows to exactly the modules
# that are genuinely absent rather than loosening strict mode anywhere else.
[[tool.mypy.overrides]]
module = ["opentelemetry.*", "requests.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
